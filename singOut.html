    <style>
        .card-imp-top {
            height: 200px;
            object-fit: cover;
           /* transition: transform 0.3s ease-in-out;/*Transición para la imagen*/
        }

        .card {
            transition: box-shadow 0.3s ease-in-out;
            /*Suaviza transición*/
            cursor: pointer;
            overflow: hidden;/*oculta lo que se salga de la tarjeta*/
        }

        .card:hover {
           transform: scale(1.05);
            /*escala la tarjeta cuando el mouse está encima*/
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);/*sombra cursor: pointer;
            /*Cursor*/
        }
        #contenedorTarjetas {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url(./assets/bellasartes.png);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .typewriter {
            overflow: hidden;
            /*Oculta texto*/
            border-right: .15em solid orange;
            /*cursor*/
            white-space: nowrap;
            /*Evita que el texto salte a la sig. linea*/
            margin: 0 auto;
            padding: 1.5rem;
            letter-spacing: .15em;
            animation:
                typing 3.5s steps(35, end)forwards,
                blink-caret .60s step-end 7 forwards;
            font-family:'Dancing Script', cursive; 
            font-size: 3rem;

        }

        /* La animación de "escritura" */
        @keyframes typing {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }

        /* La animación del cursor que parpadea */
        @keyframes blink-caret {

            from,
            to {
                border-color: transparent
            }

            50% {
                border-color: #fff;
            }
        }
    </style>
</head>
