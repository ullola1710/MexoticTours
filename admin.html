<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <h1 class="mb-4 text-center">Gestión de Productos</h1>

  <!-- Formulario -->
  <div class="card p-3 mb-4">
    <div id="alertas"></div>
    <form id="formProducto" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nombre</label>
        <input type="text" id="nombre" class="form-control">
      </div>
      <div class="col-md-3">
        <label class="form-label">Precio</label>
        <input type="number" id="precio" class="form-control" step="0.01">
      </div>
      <div class="col-md-3">
        <label class="form-label">Categoría</label>
        <select id="categoria" class="form-select">
          <option value="">Seleccione</option>
          <option>Arte</option>
          <option>Cultura</option>
          <option>Cultura y Gastronomía</option>
          <option>Fiesta</option>
          <option>Gastronomía</option>
        </select>
      </div>
      <div class="col-md-12">
        <label class="form-label">Descripción</label>
        <textarea id="descripcion" class="form-control"></textarea>
      </div>
      <div class="col-md-12">
        <label class="form-label">Imagen</label>
        <input type="file" id="imagen" class="form-control" accept="image/*">
      </div>
      <div class="col-12 text-end">
        <button type="submit" class="btn btn-primary">Guardar Producto</button>
      </div>
    </form>
  </div>

  <!-- Tabla -->
  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Categoría</th>
        <th>Imagen</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>
</div>

<script>
const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/dwkhgnoac/image/upload";
const CLOUDINARY_UPLOAD_PRESET = "MexoticTours";

let productos = [];
let editIndex = null;
const tabla = document.getElementById("tabla");
const form = document.getElementById("formProducto");
const alertas = document.getElementById("alertas");

document.addEventListener("DOMContentLoaded", () => {
  const almacenados = localStorage.getItem("productos");
  if (almacenados) {
    productos = JSON.parse(almacenados);
    renderProductos();
  } else {
    fetch("products.json")
      .then(res => res.json())
      .then(data => {
        productos = data;
        guardarLocal();
        renderProductos();
      })
      .catch(err => console.error("Error cargando JSON:", err));
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  alertas.innerHTML = "";

  const nombre = document.getElementById("nombre").value.trim();
  const precio = document.getElementById("precio").value.trim();
  const categoria = document.getElementById("categoria").value.trim();
  const descripcion = document.getElementById("descripcion").value.trim();
  const imagenFile = document.getElementById("imagen").files[0];

  if (!nombre || !precio || !categoria || !descripcion) {
    mostrarAlerta("Todos los campos son obligatorios", "danger");
    return;
  }

  let imagenUrl = "";
  if (imagenFile) {
    try {
      const formData = new FormData();
      formData.append("file", imagenFile);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
      const res = await fetch(CLOUDINARY_URL, { method: "POST", body: formData });
      const data = await res.json();
      imagenUrl = data.secure_url;
    } catch (error) {
      mostrarAlerta("Error al subir la imagen", "danger");
      return;
    }
  } else if (editIndex !== null) {
    imagenUrl = productos[editIndex].imagen; // Mantener la anterior
  }

  const nuevoProducto = { nombre, precio, categoria, descripcion, imagen: imagenUrl };

  if (editIndex !== null) {
    productos[editIndex] = nuevoProducto;
    editIndex = null;
    mostrarAlerta("Producto editado correctamente", "success");
  } else {
    productos.push(nuevoProducto);
    mostrarAlerta("Producto agregado correctamente", "success");
  }

  guardarLocal();
  renderProductos();
  form.reset();
});

function renderProductos() {
  tabla.innerHTML = "";
  productos.forEach((p, index) => {
    tabla.innerHTML += `
      <tr>
        <td>${p.name}</td>
        <td>$${p.precio}</td>
        <td>${p.category}</td>
        <td><img src="${p.img}" style="width:60px; height:60px; object-fit:cover; border-radius:5px;"></td>
        <td>
          <button class="btn btn-warning btn-sm" onclick="editarProducto(${index})">Editar</button>
          <button class="btn btn-danger btn-sm" onclick="eliminarProducto(${index})">Eliminar</button>
        </td>
      </tr>
    `;
  });
}

function editarProducto(i) {
  const p = productos[i];
  document.getElementById("nombre").value = p.name;
  document.getElementById("precio").value = p.precio;
  document.getElementById("categoria").value = p.category;
  document.getElementById("descripcion").value = p.descripcion;
  editIndex = i;
}

function eliminarProducto(i) {
  if (confirm("¿Seguro que quieres eliminar este producto?")) {
    productos.splice(i, 1);
    guardarLocal();
    renderProductos();
    mostrarAlerta("Producto eliminado", "warning");
  }
}
