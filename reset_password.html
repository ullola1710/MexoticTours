<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cambio de contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="CSS/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body{
            margin: 0;
            padding: 0;
            min-height: 100vh;
            height: 100dvh;
            background-color: rgba(203, 173, 246, 0.389);
        }

    </style>

</head>
<body class=" d-flex justify-content-center align-items-center">
    <main>
        <div id="container-password" class="border rounded p-4 shadow bg-white" style="width: 350px">
            <div class="mb-3">
                <label for="newPassword" class="form-label">Ingrese nueva contraseña</label>
                <input type="password" class="form-control" id="newPassword" placeholder="contraseña nueva" required>
                <div class="invalid-feedback">
                    La contraseña debe tener mínimo 8 caracteres, una mayúscula, un número y un símbolo.
                </div>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirmar nueva contraseña</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="confirma contraseña" required>
                <div class="invalid-feedback">
                    las contraseñas no coinciden.
                </div>
            </div>
            <button id="btnConfirmPassword" class="btn btn-lg mxreg-btn" style="width: 100%">Guardar nueva contraseña  </button>
        </div>
    </main>


    
    <!-- Validacciones de contraseñas y ventana emergente de sweetalert -->
    <script>
        const password_1 = document.getElementById("newPassword");
        const password_2 = document.getElementById("confirmPassword");
        //Validacion de contraseña con regex
        const regexSegura =  /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?])\S{8,}$/;

        [password_1,password_2].forEach(input =>{
            input.addEventListener("keydown",(e) =>{
                if(e.key === " ") e.preventDefault();
            });
        });

        function validInputs(){
            const  pass_1 =password_1.value.trim();
            const  pass_2 =password_2.value.trim();

            if(regexSegura.test(pass_1)){
                password_1.classList.add("is-valid");
                password_1.classList.remove("is-invalid");
            }else{
                password_1.classList.remove("is-valid");
                if(pass_1 !== "") password_1.classList.add("is-invalid");
            }
            if (regexSegura.test(pass_2) && pass_2 === pass_1){
                password_2.classList.add("is-valid");
                password_2.classList.remove("is-invalid");
            }else{
                password_2.classList.remove("is-valid");
                if(pass_2 !== "") password_2.classList.add("is-invalid");
            }
        }

        password_1.addEventListener("input",validInputs);
        password_2.addEventListener("input",validInputs);
        
        document.getElementById("btnConfirmPassword").addEventListener("click",function(e){
            e.preventDefault();
            const pass_1 = password_1.value.trim();
            const pass_2 = password_2.value.trim();

             let valido = regexSegura.test(pass_1) && regexSegura.test(pass_2) && pass_1 === pass_2;

            if (!valido){
                password_1.classList.add("is-invalid");
                password_1.classList.remove("is-valid");
                password_2.classList.add("is-invalid");
                password_2.classList.remove("is-valid");

                password_1.value = "";
                password_2.value = "";

            }else{
                let usuarioJSON = localStorage.getItem("usuarios");
                let usuarios = usuariosJSON ? JSOn.parse(usuariosJSON): [];

                const emailActual = localStorage.getItem("usuarioActual");

                usuarios = usuarios.map(usuario => {
                    if(usuario.email === emailActual){
                        return{...usuario, password: pass_1};
                    }
                    return usuario;
                });

                localStorage.setItem("usuarios", JSON.stringify(usuarios));

                swal.fire({
                    icon:"success",
                    title: "¡Contraseña actualizada!",
                    text : "Tu contraseña se guardó correctamente",
                    confirmButtonText: "OK"
                }).then(() =>{
                    window.location.href = "index.html";
                });
            }
            
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    
    
</body>
</html>
