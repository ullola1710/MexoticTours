<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Detalle Tour</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="./CSS/costum.css" rel="stylesheet">
    <link href="./CSS/style.css" rel="stylesheet">
<style>
  .masthead {
    background-size: cover;
    min-height: 60vh;
    position: relative;
    color: white;
    text-shadow: 2px 2px 2px rgba(0,0,0,0.5);
  }
  .color-overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.4);
    top: 0; left: 0;
  }
  .tour-header-content {
    position: relative;
    z-index: 1;
    padding: 3rem;
  }
  .details-container {
    background: rgba(255 255 255 / 0.8);
    border-radius: 15px;
    padding: 1.5rem;
    margin-top: -50px;
  }
</style>
</head>
<body>

<div id="navbar-container"></div>

<header id="tour-header" class="masthead">
  <div class="color-overlay"></div>
  <div class="container d-flex flex-column justify-content-center align-items-center text-center tour-header-content">
    <h1 id="tour-title"></h1>
    <h4 id="tour-price" class="mb-3"></h4>
    <button id="btn-reserva" class="btn btn-primary"><i class="bi bi-calendar-plus"></i> RESERVA</button>
  </div>
</header>

<div class="container details-container my-4">
  <div class="row">
    <div class="col-md-6">
      <img id="tour-image" src="" alt="Imagen Tour" class="img-fluid rounded" />
    </div>
    <div class="col-md-6">
      <h5><i class="bi bi-list-ul"></i> INCLUYE</h5>
      <ul id="tour-includes"></ul>
    </div>
  </div>
  <div class="row mt-4">
    <div class="col" id="tour-info"></div>
  </div>
</div>

<div id="footer-container"></div>

<script src="./JS/navbar.js"></script>
<script src="./JS/footer.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Datos de ejemplo para tours
  const toursData = {
    tequila: {
      title: "Tour Tequila",
      price: "Desde $1500 por persona",
      image: "./assets/tequila-tour.jpg",
      includes: [
        "Ida y vuelta desde Guadalajara.",
        "Transporte entre haciendas, campos de agave y centro del pueblo.",
        "Recorrido por fábricas de tequila.",
        "Demostración del proceso de producción de tequila.",
        "Cata de tequilas.",
        "Paseo guiado por campos de agave.",
        "Comida tradicional jalisciense.",
        "Recorrido por el Pueblo Mágico."
      ],
      info: `
        <p><i class="bi bi-alarm"></i> Salida: 9:00 AM<br>
        Regreso aproximado: 6:00 PM</p>
        <p><i class="bi bi-calendar-event"></i> Salidas todos los sábados y domingos.<br>
        También disponible en días festivos y vacaciones (consulta disponibilidad).</p>
        <p><i class="bi bi-people"></i> Grupos pequeños para atención personalizada.<br>
        ¡Reserva con anticipación!</p>
      `,
      background: "./assets/fondo-tequila.jpg"
    },
    // Puedes agregar más tours aquí...
  };

  // Función para obtener parámetro URL
  function getParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  // Función para cargar datos del tour en la página
  function loadTour(tourKey) {
    const tour = toursData[tourKey];
    if (!tour) {
      document.body.innerHTML = "<h2>Tour no encontrado.</h2>";
      return;
    }
    document.getElementById("tour-title").textContent = tour.title;
    document.getElementById("tour-price").textContent = tour.price;
    document.getElementById("tour-image").src = tour.image;
    document.getElementById("tour-info").innerHTML = tour.info;
    document.getElementById("tour-header").style.backgroundImage = `url('${tour.background}')`;

    const includesList = document.getElementById("tour-includes");
    includesList.innerHTML = "";
    tour.includes.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item;
      includesList.appendChild(li);
    });
  }

  // Al cargar la página, obtener el tour y mostrar
  window.onload = () => {
    const tourKey = getParam("tour");  // Ejemplo URL: detail.html?tour=tequila
    loadTour(tourKey || "tequila"); // Si no hay parámetro, muestra tequila por defecto
  };
</script>

</body>
</html>
