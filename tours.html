<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detalle Tour</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"rel="stylesheet"/>
    <link href="./CSS/style.css" rel="stylesheet" />
    <link href="./CSS/tours.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar-container"></div>
    <main id="tc" class="hero-bg">


      <!-- Imagen del tour, titulo, precio, boton reserva -->
      <div class="container details-container mt-5 hero-content">
        <div class="row align-items-center min-vh-50 mb-3">
          <div class="col-12 col-md-6 d-flex flex-column justify-content-center align-items-center text-center order-1 order-md-2 mb-3 mb-md-0">
              <h1 id="tour-title" class="display-4 fw-bold text-white mb-2" style="margin: 4rem; font-size: 3.5rem;"></h1>
              <h4 id="tour-price" class="text-white mb-3 m-0" style="font-size: 2.2rem;"></h4>
              <button id="btn-reserva" class]="mx-auto">
                <i class="bi bi-calendar-plus me-2"></i> RESERVA
              </button>
          </div>
            <div class="col-12 col-md-6 text-center  order-2 order-md-1">
              <img id="tour-image"src="" alt="Imagen Tour" class="img-fluid rounded"/>
            </div>
          </div>
        </div>
    
          <!-- Datos -->
          <div class = "container tour-panels mb-5" >
            <div class="row g-3" style="background-color: rgb(255, 255, 255); opacity: 90%;  border-radius: 10px; margin: 2rem 0.5rem 1rem 0.5rem;">
              <div class="col-lg-7">
                <div class="glass pt-2 p-4 h-100">
                  <h5 class="mb-3"><i class="bi bi-list-ul" style="margin-right: 0.5rem;"></i>INCLUYE</h5>
                  <ul id="tour-includes" class="list-unstyled mb-0"></ul>
                </div>
              </div>
              <div class="col-lg-5">
                <div class="glass pt-2 p-4 h-100">
                  <h5 class="mb-3">INFORMACIÓN DEL TOUR</h5>
                  <div id="tour-info" class="smaill"></div>
                </div>
              </div>

            </div>
          </div>
        </main>
       
    
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    
    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <!-- Inicialización de EmailJS -->
    <script>
    (function () {
        emailjs.init("GNnB5jB5JcNSpPcEb"); // Tu User ID público
    })();
    </script>

    <!-- Tu script del footer que usa EmailJS -->
    <script src="./JS/footer.js"></script>

    <script src="./JS/navbar.js" defer></script>
    <!-- <script src="./JS/footer.js"></script> -->
    <script src="./JS/cards_products.js"></script>
     
  </body>
</html>
