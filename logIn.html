<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./CSS/style.css" />

</head>

<body style="text-align: center; background-color:#292B4B;">
    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content with Image and Login Panel -->
    <div class="mt-main-container container-fluid">
        <div class="row">
            <div class="mt-image-col col-md-6">
                <img src="./assets/Angelcut.jpg" alt="Angel of Independence" class="mt-image img-fluid">
            </div>
            <div class="mt-login-col col-md-6">
                <div class="mt-login-panel login-panel">
                    <h2 style="text-align: center;">BIENVENIDO A MEXOTIC TOURS</h2>
                    <p style="color: #fa89cf; text-align: center;">Inicia sesión para seguir explorando México</p>
                    <form>
                        <div class="mt-form-group mb-3">
                            <label for="mt-email" class="form-label">Correo electrónico</label>
                            <input type="email" class="mt-form-control form-control" id="mt-email"
                                placeholder="Correo electrónico">
                            <div id="emailFeedback" class="invalid-feedback"></div>
                        </div>
                        <div class="mt-form-group mb-3">
                            <label for="mt-password" class="form-label">Contraseña de sesión</label>
                            <input type="password" class="mt-form-control form-control" id="mt-password"
                                placeholder="Contraseña de sesión">
                            <div id="passwordFeedback" class="invalid-feedback"></div>
                        </div>
                        <button type="submit" class="mt-btn-submit btn btn-purple">Inicio de sesión</button>
                    </form>
                    <br>
                    <p style="text-align: center;"><a href="#">¿Olvidaste tu contraseña?</a></p>
                    <p style="text-align: center;">¿No tienes cuenta? <a href="./registro.html">Regístrate</a></p>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="./JS/cart.js"></script>
    <script src="./JS/navbar.js"></script>
    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function () {
            emailjs.init("GNnB5jB5JcNSpPcEb"); // Tu User ID público
        })();
    </script>
    <script src="./JS/footer.js"></script>
    <script type="module" src="./JS/login.js"></script>

</body>

</html>
