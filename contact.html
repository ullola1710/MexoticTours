<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous"/>

  <link rel="stylesheet" href="./CSS/style.css" />
  <link rel="stylesheet" href="./CSS/contact.css" />
</head>

<body>
  <!-- Dupla: Jade - Brandy  -->
  <main class="container-fluid p-0">
    <div class="card">
      <img src="./assets/GardenCastilloChapultepec.jpg" class="card-img" alt="Castillo de Chapultepec"/>
      <div class="card-img-overlay">
        <h1 class="card-title">No te quedes con dudas</h1>
        <p class="card-text">contáctanos</p>
      </div>
    </div>

    <!-- Formulario -->
    <div id="forms" class="d-flex justify-content-center align-items-center" style="padding: 20px">
      <!-- min-height: 100vh; -->
      <form class="w-100" style="max-width: 500px">
        <div class="mb-2">
          <label for="validationNombre" class="form-label">Nombre(s)</label>
          <input type="text" class="form-control" id="validationNombre" value="" placeholder="Ingrese su nombre(s)" required />
          <div class="invalid-feedback">Nombre(s) no válido</div>
        </div>

        <div class="mb-2">
          <label for="validationApellido" class="form-label">Apellido(s)</label>
          <input type="text" class="form-control" id="validationApellido" placeholder="Ingrese su apellido(s)" required />
          <div class="invalid-feedback">Apellido(s) no válido</div>
        </div>

        <!-- Correo -->
        <div class="mb-2">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" placeholder = "Ingrese su dirección de correo electrónico"
            aria-describedby="validationServerEmail" required />
          <div id="validationServerEmail" class="invalid-feedback">
            Dirección de correo electrónico no válida
          </div>
        </div>

        <!-- Confirmación de correo -->
        <div class="mb-2">
          <label for="validationEmail" class="form-label">Confirmar correo electrónico</label>
          <input type="email" class="form-control" id="validationEmail" placeholder = "Confirme su dirección de correo electrónico"
            aria-describedby="confirmEmail" required />
          <div id="validationConfirmEmail" class="invalid-feedback">
            Las direcciones de correo electrónico no coinciden
          </div>
        </div>

        <div class="mb-2">
          <label for="validationTelefono" class="form-label">Teléfono</label>
          <input type="text" class="form-control" id="validationTelefono" placeholder = "Ingrese su número telefónico"
            aria-describedby="validationServerTelefono" required />
          <div id="validationServerTelefono" class="invalid-feedback">
            Número telefónico no válido
          </div>
        </div>

        <div class="mb-2">
          <label for="inputMensaje" class="form-label">Mensaje</label>
          <input type="text" class="form-control" id="inputMensaje" placeholder="Mensaje"/>
          <div id="validationServerMessage" class="invalid-feedback">
            Mensaje no válido
          </div>
        </div>

        <div class="mb-1">
          <label> Politica de privacidad </label>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="privacyCheck"
              aria-describedby="privacyCheckFeedback" required/>
            <label class="form-check-label" for="privacyCheck">
              Autorizo el uso de mis datos conforme a la politica de
              privacidad del servicio.
            </label>
            <div id="privacyCheckFeedback" class="invalid-feedback">
              Para poder continuar, es necesario aceptar nuestra política de privacidad.
            </div>
          </div>
        </div>

        <div class="col-12">
          <button id="boton-enviar" class="btn btn-lg" type="submit">Enviar</button>
        </div>

      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
  <script src="./js/main.js"></script>
</body>

</html>
