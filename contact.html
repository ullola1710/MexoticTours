<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="./CSS/style.css" />
    <link rel="stylesheet" href="./CSS/contact.css" />
  </head>

  <body>
    <main class="container-fluid p-0">
      <div class="card">
        <img
          src="./assets/GardenCastilloChapultepec.jpg"
          class="card-img"
          alt="Castillo de Chapultepec"
        />
        <div class="card-img-overlay">
          <h1 class="card-title">No te quedes con dudas</h1>
          <p class="card-text">contáctanos</p>
        </div>
      </div>

      <!-- Formulario -->
      <div
        id="forms"
        class="d-flex justify-content-center align-items-center"
        style="min-height: 100vh; padding: 20px"
      >
        <form class="w-100" style="max-width: 500px">
          <div class="mb-2">
            <label for="validationNombre" class="form-label">Nombre(s)</label>
            <input type="text" class="form-control" id="validationNombre" value="Mark" required/>
            <div class="valid-feedback">Es correcto</div>
          </div>
          <div class="mb-2">
            <label for="validationApellido" class="form-label" >Apellido(s)</label >
            <input type="text" class="form-control" id="validationApellido" value="Otto" required/>
            <div class="valid-feedback">Es correcto</div>
          </div>
          <div class="mb-2">
            <label for="validationEmail" class="form-label">Correo electrónico</label>
            <input type="text"class="form-control is-invalid" id="validationEmail" aria-describedby="validationServerEmail" required />
            <div id="validationServerEmail" class="invalid-feedback">
              Por favor ingresa de forma correcta tu correo electrónico
            </div>
          </div>
          <div class="mb-2">
            <label for="validationTelefono" class="form-label">Telefono</label>
            <input type="text" class="form-control is-invalid" id="validationTelefono" aria-describedby="validationServerTelefono" required/>
            <div id="validationServerTelefono" class="invalid-feedback">
              Cantidad invalida
            </div>
          </div>
          <div class="mb-2">
            <label for="inputMensaje" class="form-label">Mensaje</label >
            <input type="text"class="form-control"id="inputMensaje" />
          </div>
          <div class="mb-1">
            <label> Politica de privacidad </label>
            <div class="form-check">
              <input class="form-check-input is-invalid" type="checkbox"value="" id="invalidCheck3" aria-describedby="invalidCheck3Feedback" required/>
              <label class="form-check-label" for="invalidCheck3">
                Autorizo el uso de mis datos conforme a la politica de
                privacidad del servicio.
              </label>
              <div id="invalidCheck3Feedback" class="invalid-feedback mb-2">
                Debes estar deacuerdo antes de enviar
              </div>
            </div>
          </div>
          <div class="col-12">
            <button id="boton-enviar" class="btn btn-lg" type="submit">Enviar</button>
          </div>
        </form>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
    <script src="./js/main.js"></script>
  </body>
</html>
