<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil del Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #acb1f88c;
        }
        .profile-card {
            background-color: #fff;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .review-form {
            background-color: #fff;
            padding: 1.5rem;
            border-radius: 0.8rem;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container my-5">
    <!-- Perfil del usuario -->
    <div class="profile-card text-center mb-4">
        <i class="bi bi-person-circle fs-1 mb-2"></i>
        <!-- debo poner los datos del usuario con el localStorage cuando incia sesion  -->
        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#historialCompras" aria-expanded="false" aria-controls="historialCompras">
            Historial de Compras
        </button>
    </div>

    <!-- Historial de Compras -->
    <div class="collapse" id="historialCompras">
        <div class="card card-body mb-4">
            <h5>Mis Tours </h5>
            <ul class="list-group mb-3">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <!-- Aqui irian el nombre de los tours -->
                    <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="collapse" data-bs-target="#reviewForm1" aria-expanded="false">
                        Escribir Reseña
                    </button>
                </li>
                <div class="collapse" id="reviewForm1">
                    <div class="review-form mt-3">
                        <form>
                            <div class="mb-3">
                                <label for="reviewTitle1" class="form-label">Título de la reseña</label>
                                <input type="text" class="form-control" id="reviewTitle1" placeholder="Escribe un título">
                            </div>
                            <div class="mb-3">
                                <label for="reviewContent1" class="form-label">Reseña</label>
                                <textarea class="form-control" id="reviewContent1" rows="3" placeholder="Escribe tu experiencia"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="reviewRating1" class="form-label">Calificación</label>
                                <select class="form-select" id="reviewRating1">
                                    <option value="5">★★★★★ 5 - Excelente</option>
                                    <option value="4">★★★★ 4 - Muy bueno</option>
                                    <option value="3">★★★ 3 - Bueno</option>
                                    <option value="2">★★ 2 - Regular</option>
                                    <option value="1">★ 1 - Malo</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success">Enviar Reseña</button>
                        </form>
                    </div>
                </div>
            </ul>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
