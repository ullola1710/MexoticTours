<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="./CSS/style.css" />

  <style>
    body {
      background-color: #fff;
      font-family: Arial, sans-serif;
    }

    .sidebar {
      min-height: 100vh;
      border-right: 1px solid #eee;
      margin-top: 10rem;
    }

    .sidebar .nav-link {
      font-size: 1rem;
      margin: 15px 0;
    }

    .profile-box {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 25px;
      background: #fff;
      margin-top: 10rem;
    }

    .profile-label {
      font-weight: bold;
    }

    .profile-text {
      color: #999;
    }
  </style>



</head>

<body>
  <!-- Navbar -->
  <div id="navbar-container"></div>
  <div class="container-fluid">
    <div class="row">

      <!-- Sidebar -->
      <div class="col-md-3 col-lg-2 d-flex flex-column align-items-center justify-content-start sidebar p-4">
        <div class="text-center mb-4">
          <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="user" width="80"
            class="rounded-circle mb-2">
          <p class="mb-0">Hola!</p>
        </div>
        <nav class="nav flex-column text-center w-100">
          <a class="nav-link active border-bottom" href="#">Perfil</a>
          <a class="nav-link border-bottom mt-auto" href="./index.html">
            Log out <i class="bi bi-box-arrow-right"></i>
          </a>
        </nav>
      </div>
      <!-- Main Content -->
      <div class="col-md-9 col-lg-10 p-5">
        <div class="profile-box">
          <div class="row mb-3">
            <div class="col-md-6">
              <p class="profile-label">Nombre</p>
              <p class="profile-text">Nombre usuario</p>
            </div>
            <div class="col-md-6">
              <p class="profile-label">Apellido</p>
              <p class="profile-text">Apellido usuario</p>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-12">
              <p class="profile-label">E-mail</p>
              <p class="profile-text">Correo usuario</p>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-12">
              <p class="profile-label">Teléfono</p>
              <p class="profile-text">Teléfono usuario</p>
            </div>
          </div>
          <div class="text-end">
            <a href="#" class="btn btn-link">Editar</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
  <script src="./JS/cart.js"></script>
  <script src="./JS/navbar.js"></script>
  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>
    (function () {
      emailjs.init("GNnB5jB5JcNSpPcEb"); // Tu User ID público
    })();
  </script>
  <script src="./JS/footer.js"></script>

</body>

</html>
