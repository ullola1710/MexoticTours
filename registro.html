<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>
    <div id="navbar-container"></div>
    <header class="mxreg-masthead">
        <div class="overlay d-flex justify-content-center align-items-center">
            <form id="registerForm" class="form-container p-4 rounded shadow needs-validation" novalidate>
                <h1>REGISTRO</h1>
                <!-- Nombre -->
                <div class="mb-2">
                    <label for="validationNombre" class="form-label">Nombre(s):</label>
                    <input type="text" class="form-control" id="validationNombre" name="nombre" placeholder="Ingrese su nombre(s)" required>
                    <div class="invalid-feedback">Nombre(s) no válido</div>
                </div>
                <!-- Teléfono -->
                <div class="mb-2">
                    <label for="telefono" class="form-label">Número de Teléfono</label>
                    <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Teléfono" required>
                    <div id="telefonoFeedback" class="invalid-feedback">Número de teléfono no válido</div>
                </div>
                <!-- Correo -->
                <div class="mb-2">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="correo" placeholder="E-mail" required>
                    <div id="emailFeedback" class="invalid-feedback">Correo no válido</div>
                </div>
                <!-- Contraseña -->
                <div class="mb-2">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Ingrese contraseña" required>
                    <div id="passwordFeedback" class="invalid-feedback">Contraseña no válida</div>
                </div>
                <!-- Confirmar contraseña -->
                <div class="mb-2">
                    <label for="confirmPassword" class="form-label">Confirma Contraseña</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirma contraseña" required>
                    <div id="confirmPasswordFeedback" class="invalid-feedback">Contraseñas no coinciden</div>
                </div>
                <!-- Términos y Condiciones -->
                <div class="mb-1">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="privacyCheck" name="politicaPrivacidad" required>
                        <label class="form-check-label" for="privacyCheck">
                            <a href="#" id="privacyLink">Acepto Términos y Condiciones</a>
                        </label>
                        <div id="privacyCheckFeedback" class="invalid-feedback">Debe aceptar los términos y condiciones</div>
                    </div>
                </div>
                <br>
                <div class="col-12">
                    <button class="btn btn-lg mxreg-btn" type="submit">Registro</button>
                </div>
            </form>
        </div>
    </header>
    <div id="footer-container"></div>
    <script src="./JS/navbar.js" defer></script>
    <script src="./JS/footer.js"></script>
    <script src="./JS/registro.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
