<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./CSS/style.css" />

    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: url("./assets/Foto_registro.jpg");
        background-size: 130%;
        background-position: -30px -850px;
      }
      .overlay {
        background-color: rgba(255, 255, 255, 0.4);
        min-height: 100vh;
      }
      #container_form {
        margin-top: 50px;
      }

      .form-container{
        background-color: (255,255,255,0.95);
        max-width: 400px;
        width: 100%;
        border: 2px solid black;
        border-radius: 15px;
        box-shadow: 0 5px 15ps ;
      }

      @media (max-width: 768px) {
        body {
          background-size: 120%;
          background-position: center -180px;
        }
      }
    </style>
  </head>
  <body>
    <div id="navbar-container"></div>

    <main>
      <div id="container_form"class="overlay d-flex justify-content-center align-items-center">
        <div class="form-container p-4 rounded shadow">

          <!-- Nombre -->
          <h1 style="text-align: center">REGISTRO</h1>
          <form id="form" novalidate>
            <div class="mb-2">
              <label for="validationNombre" class="form-label">Nombre(s) :</label>
              <input type="text" class="form-control" id="validationNombre" name="nombre"placeholder="Ingrese su nombre(s)"/>
              <div id="nombreFeedback" class="invalid-feedback"></div>
            </div>
            <!-- Teléfono -->
            <div class="mb-2">
              <label for="validationTelefono" class="form-label"
                >Número de Teléfono</label
              >
              <input
                type="text"
                class="form-control"
                id="validationTelefono"
                name="validationTelefono"
                placeholder="Teléfono"
              />
              <div id="telefonoFeedback" class="invalid-feedback"></div>
            </div>
            <!-- Correo -->
            <div class="mb-2">
              <label for="email" class="form-label">E-mail</label>
              <input
                type="email"
                class="form-control"
                id="validationEmail"
                name="correo"
                placeholder="e-mail"
              />
              <div id="emailFeedback" class="invalid-feedback"></div>
            </div>
            
            <!-- Contraseña -->
            <div class="mb-2">
              <label for="password" class="form-label">Contraseña</label>
              <input
                type="password"
                class="form-control"
                id="validationPassword"
                name="password"
                placeholder="Ingrese contraseña"
              />
              <div id="passwordFeedback" class="invalid-feedback"></div>
            </div>

            <!-- Confirmar contraseña -->
            <div class="mb-2">
              <label for="confirmPassword" class="form-label"
                >Confirma Contraseña</label
              >
              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirma contraseña"
                autocomplete="new-password"
              />
              <div id="confirmPasswordFeedback" class="invalid-feedback"></div>
            </div>

            <!-- Términos y Condiciones -->
            <div class="mb-1">
              <label> </label>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="privacyCheck"
                  name="checkTerminos"
                />
                <label class="form-check-label" for="privacyCheck">
                  <a href="#" id="privacyLink">Acepto términos y condiciones</a>
                </label>
                <!-- <label class="form-check-label" for="privacyCheck">
              Autorizo el uso de mis datos conforme a la política de
              privacidad del servicio.
            </label> -->
                <div id="privacyCheckFeedback" class="invalid-feedback"></div>
              </div>
            </div>
            <br />
            <div class="col-12">
              <button
                class="btn btn-lg mxreg-btn"
                type="submit"
                style="width: 100%"
              >
                Registro
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <div id="footer-container"></div>
    <!-- <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"></script> -->
    <script src="./JS/navbar.js" defer></script>
    <script src="./JS/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <!-- <script type="module" src="./JS/registro1.js"></script> -->
    <script src="./JS/register.js"></script> <!--JSON de registro-->
  </body>
</html>
