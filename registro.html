<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/style.css">


</head>
<body>

    <div id="navbar-container"></div>
  <header class="mxreg-masthead">
    <div class="overlay d-flex justify-content-center align-items-center">
        <div class="form-container p-4 rounded shadow">
        <!-- Nombre -->
         <h1>REGISTRO</h1>
        <div class="mb-2">
          <label for="validationNombre" class="form-label">Nombre(s) : </label>
          <input type="text" class="form-control" id="validationNombre" name="nombre"
            placeholder="Ingrese su nombre(s)" />
          <div class="invalid-feedback">Nombre(s) no válido</div>
        </div>
        <!-- Teléfono -->
        <div class="mb-2">
          <label for="telefono" class="form-label">Número de Teléfono</label>
          <input type="telefono" class="form-control" id="telefono" name="telefono"
            placeholder="telefono" />
          <div id="telefonoFeedback" class="invalid-feedback"></div>
        </div>
        <!-- Correo -->
        <div class="mb-2">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" name="correo"
            placeholder="e-mail" />
          <div id="emailFeedback" class="invalid-feedback"></div>
        </div>
        <!-- Contraseña -->
         <div class="mb-2">
          <label for="validationApellido" class="form-label">Contraseña</label>
          <input type="text" class="form-control" id="validationApellido" name="apellido"
            placeholder="Ingrese contraseña" />
          <div class="invalid-feedback">Contraseña no válida</div>
            </div>

            <!-- Confirmar contraseña -->
         <div class="mb-2">
          <label for="validationApellido" class="form-label">Confirma Contraseña</label>
          <input type="text" class="form-control" id="validationApellido" name="apellido"
            placeholder="Confirma contraseña" />
          <div class="invalid-feedback">Contraseña no válida</div>
            </div>

        <!-- Términos y Condiciones -->
        <div class="mb-1">
          <label> </label>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="privacyCheck" name="politicaPrivacidad" />
            <label class="form-check-label" for="privacyCheck">
              <a href="#" id="privacyLink">Acepto Términos y Condiciones</a>
            </label>
            <!-- <label class="form-check-label" for="privacyCheck">
              Autorizo el uso de mis datos conforme a la política de
              privacidad del servicio.
            </label> -->
            <div id="privacyCheckFeedback" class="invalid-feedback"></div>
          </div>
        </div>
        <br>
        <div class="col-12">
          <button class="btn btn-lg mxreg-btn" type="submit">Registro</button>
        </div>

      </form>

        </div>
    </div>
</header>




    
  </main>
  <div id="footer-container"></div>
  
<div id="footer-container"></div>
    <script src="./JS/navbar.js" defer></script>
    <script src="./JS/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
