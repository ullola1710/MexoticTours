<body>

  <div id="navbar-container"></div>

  <main>
    <div id="container_form" class="overlay d-flex justify-content-center align-items-center">
      <div class="form-container p-4 rounded shadow">
        <!-- Nombre -->
        <h1 style="text-align: center">REGISTRO</h1>
       <!-- se agrega método post -->
        <form id="registroForm" method="POST" class="needs-validation" novalidate>
          <div class="mb-2">
            <label for="validationNombre" class="form-label">Nombre(s) :</label>
            <input type="text" class="form-control" id="validationNombre" name="nombre"
              placeholder="Ingresa tu nombre completo" required />
            <div id="nombreFeedback" class="invalid-feedback-custom"></div>
          </div>
          <!-- Teléfono -->
          <div class="mb-2">
            <label for="validationTelefono" class="form-label">Número de Teléfono</label>
            <input type="tel" class="form-control" id="validationTelefono" name="Telefono"
              placeholder="Teléfono" required/>
            <div id="telefonoFeedback" class="invalid-feedback-custom"></div>
          </div>
          <!-- Correo -->
          <div class="mb-2">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" name="correo" placeholder="E-mail" required />
            <div id="emailFeedback" class="invalid-feedback-custom"></div>
          </div>
          <!-- Contraseña -->
          <div class="mb-2">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password"
              placeholder="Ingresa contraseña" required />
            <div id="passwordFeedback" class="invalid-feedback-custom"></div>
          </div>

          <!-- Confirmar contraseña -->
          <div class="mb-2">
            <label for="confirmPassword" class="form-label">Confirma Contraseña</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
              placeholder="Confirma contraseña" autocomplete="new-password" required />
            <div id="confirmPasswordFeedback" class="invalid-feedback-custom"></div>
          </div>

          <!-- Términos y Condiciones -->
          <div class="mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="privacyCheck" name="checkTerminos" required/>
              <label class="form-check-label" for="privacyCheck">
                <a href="#" id="privacyLink">Acepto términos y condiciones</a>
              </label>
              <div id="privacyCheckFeedback" class="invalid-feedback"></div>
            </div>
          </div>
          <div class="col-12">
            <button class="btn btn-lg mxreg-btn" type="submit" style="width: 100%">
              Registro
            </button>
          </div>
        </form>
      <div id="statusMessage" class="mt-3 text-center" style="display: none;"></div>     </div>
    </div>
  </main>

  <div id="footer-container"></div>
  <!-- Scripts -->

            <form id="registerForm" class="form-container p-4 rounded shadow needs-validation" novalidate>
                <h1>REGISTRO</h1>
                <!-- Nombre -->
                <div class="mb-2">
                    <label for="validationNombre" class="form-label">Nombre(s):</label>
                    <input type="text" class="form-control" id="validationNombre" name="nombre" placeholder="Ingrese su nombre(s)" required>
                    <div class="invalid-feedback">Nombre(s) no válido</div>
                </div>
                <!-- Teléfono -->
                <div class="mb-2">

                    <div id="telefonoFeedback" class="invalid-feedback">Número de teléfono no válido</div>
                </div>

                <div class="mb-2">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="correo" placeholder="E-mail" required>
                    <div id="emailFeedback" class="invalid-feedback">Correo no válido</div>
                </div>
                <!-- Contraseña -->
                <div class="mb-2">
                    <label for="password" class="form-label">Contraseña</label>

                    <div id="passwordFeedback" class="invalid-feedback">Contraseña no válida</div>
                </div>
                <!-- Confirmar contraseña -->
                <div class="mb-2">
                    <label for="confirmPassword" class="form-label">Confirma Contraseña</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirma contraseña" required>
                    <div id="confirmPasswordFeedback" class="invalid-feedback">Contraseñas no coinciden</div>
                </div>
                <!-- Términos y Condiciones -->
                <div class="mb-1">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="privacyCheck" name="politicaPrivacidad" required>
                        <label class="form-check-label" for="privacyCheck">
                            <a href="#" id="privacyLink">Acepto Términos y Condiciones</a>
                        </label>
                        <div id="privacyCheckFeedback" class="invalid-feedback">Debe aceptar los términos y condiciones</div>
                    </div>
                </div>
                <br>
                <div class="col-12">
                    <button class="btn btn-lg mxreg-btn" type="submit">Registro</button>

        </div>

    <div id="footer-container"></div>
    <script src="./JS/navbar.js" defer></script>

    <script src="./JS/registro.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>


<script>
        document.getElementById("registroForm").addEventListener("submit", function(event) {
            // Evita el envío por defecto para manejarlo con JS
            event.preventDefault();
            
            const form = event.target;
            const statusMessage = document.getElementById("statusMessage");

            // Limpia mensajes anteriores
            statusMessage.style.display = 'none';
            statusMessage.textContent = '';
            
            // Revisa la validez del formulario
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            // Validaciones personalizadas
            const password = data.password;
            const confirmPassword = data.confirmPassword;
            const privacyCheck = form.querySelector('#privacyCheck').checked;

            let isValid = true;

            // Validar contraseñas
            const passwordFeedback = document.getElementById('confirmPasswordFeedback');
            if (password !== confirmPassword) {
                passwordFeedback.textContent = "Las contraseñas no coinciden.";
                passwordFeedback.style.display = 'block';
                isValid = false;
            } else {
                passwordFeedback.style.display = 'none';
            }
            
            // Validar términos y condiciones
            const privacyFeedback = document.getElementById('privacyCheckFeedback');
            if (!privacyCheck) {
                privacyFeedback.style.display = 'block';
                isValid = false;
            } else {
                privacyFeedback.style.display = 'none';
            }

            if (!isValid) {
                return;
            }
            
            // Si las validaciones pasan, se simula el envío por POST
            console.log("Datos a enviar de forma segura por POST:", data);
            
            statusMessage.style.display = 'block';
            statusMessage.textContent = "¡Registro exitoso! Los datos se han procesado de forma segura.";
            statusMessage.style.color = '#198754'; // Color de éxito

            // Aquí es donde se usaría la función fetch para enviar los datos al servidor

            })

                statusMessage.style.color = '#dc3545';
                statusMessage.style.display = 'block';
            });
            */
        });
    </script>
