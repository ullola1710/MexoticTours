<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        #navbar-custom {
            padding-left: 2rem;
            padding-right: 2rem;
            transition: transform 0.8s
        }

        .nav--hidden {
            transform: translateY(-180%);
        }

        #navbar-custom .nav-link:hover {
            color: #FFC2DD;
        }

        .logoRosa:hover {
            filter: drop-shadow(4px 4px 3px white);
            /* El filter calcula la sombra a partir de las zonas opacas del .png (distancia de sombra, dirección,)*/
        }

        /* Dropdown */
        #navbar-custom .dropdown-item:hover,
        #navbar-custom .dropdown-item:active {
            color: #FFC2DD;
            background-color: transparent;
        }

        /* Carrito */
        .bi-cart2 {
            color: white;
            transition: color 0.2s;
        }

        .bi-cart2:hover {
            color: #FFC2DD;
            filter: drop-shadow(2px 4px 3px white);
        }

        /* Para cualquier botón */
        .btn-login,
        .btn-signin {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 5.5rem;
            height: 2.8rem;
        }

        /* Botón Log in*/
        .btn-login {
            background-color: white;
            color: #09112E;
        }

        .btn-login:hover {
            background-color: #FFC2DD;
        }

        /* Botón Sign in */
        .btn-signin {
            background-color: #09112E;
            color: white;
        }

        .btn-signin:hover {
            color: #FFC2DD;
        }
    </style>
</head>

<body>

    <main class="container-fluid p-0">
        <!-- Navbar -->

        <nav id="navbar-custom" class="navbar navbar-expand-lg navbar-dark rounded-pill fixed-top"
            style="background-color: #09112E; height: 4.5rem; width: auto; margin: 2.5rem 2.5rem 0 2.5rem;">
            <div class="container-fluid">
                <a class="nav-link" href="./index.html">
                    <img class="logoRosa" src="./assets/LogoRosa.png" alt="Mexotic Tours" style="width: 3.2rem">
                </a>
                <button class="navbar-toggler position-absolute start-0" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#menuLateral" aria-controls="menuLateral" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <!-- Sección 2 -->
                <div class="position-absolute top-50 start-50 translate-middle" id="navbarSupportedContent">
                    <ul class="navbar-nav mb-2 mb-lg-0 d-flex gap-3"> <!--ACA-->
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="./aboutUs.html">Nosotras</a>
                        </li>
                        <!-- Dropdown -->
                        <li class="nav-item dropdown">
                            <a class="nav-link active dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="true">
                                Productos
                            </a>
                            <ul class="dropdown-menu" style="background-color: #8D94FF;">
                                <li><a class="dropdown-item" style="color: white;" href="./products.html">Todo</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item" style="color: white;"
                                        href="./personalized.html">Personalizado</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-disabled="page" href="./experiences.html">Experiencias</a>
                        </li>
                    </ul>
                </div>
                <!-- Sección 3 -->
                <div class="d-flex gap-2 position-absolute end-0 align-items-center pe-5">
                    <a class="nav-link" href="#"> <!-- Falta hover para carrito -->
                        <i class="bi bi-cart2 fs-2"></i>
                    </a>
                    <a class="btn btn-login rounded-pill" role="button" href="./logIn.html">Log in</a>
                    <!-- rounded-pill para hacer el botón como pildora-->
                    <a class="btn btn-signin rounded-pill" role="button" href="./signIn.html">Sign in</a>
                </div>
            </div>
        </nav>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="./js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const nav = document.getElementById('navbar-custom');
            let lastScrollY = window.pageYOffset;

            window.addEventListener('scroll', () => {
                const currentScrollY = window.pageYOffset;

                // 1) Si estás en el tope de la página, siempre mostrar
                if (currentScrollY <= 0) {
                    nav.classList.remove('nav--hidden');
                    lastScrollY = 0;
                    return;
                }

                // 2) Si scroll hacia abajo y aún no está oculto, oculta
                if (currentScrollY > lastScrollY || !nav.classList.contains('nav--hidden')) {
                    nav.classList.add('nav--hidden');
                }
                // 3) Si scroll hacia arriba y está oculto, muestra
                else if (currentScrollY < lastScrollY || nav.classList.contains('nav--hidden')) {
                    nav.classList.remove('nav--hidden');
                }

                lastScrollY = currentScrollY;
            });
        });
    </script>
</body>

</html>
