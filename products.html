<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Requierd meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0">

    <title>Productos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
<link href="./CSS/costum.css" rel="stylesheet">
<link href="./CSS/style.css" rel="stylesheet">
</head>
<body>
    <!-- navbar -->
    <div id="navbar-container"></div>
    <script src="./JS/navbar.js"></script>

    <div class="masthead"
    style="background-image: url('./assets/bellasartes.png');"
    >
         <div class="color-overlay d-flex flex-column
            justify-content-center align-items-center">
            <h1 > ¿Listo para tu próxima aventura? </h1>
                <h2> ¡Elige tu tour ahora!</h2>
         </div>
         
    </div>
<br>
    <!-- Para el filtrado general de estados -->
<div class="container">
     <section class="filtro-tours">
        <div class="d-flex justify-content-center gap-3">
        <button class="filtro-btn">CDMX</button>
         <button class="filtro-btn">Jalisco</button>
          <button class="filtro-btn">Querétaro</button>
        </div>
    </section>
</div>

<!-- Para filtrado de categoría -->

<section class="container my-5">
    <h3 class="text-center mb-4"></h3>
    <div class="d-flex justify-content-center gap-4 flex-wrap">

        <!-- Todo (sin checkbox) -->
        <span class="category-btn">
            <i class="bi bi-list-ul"></i> Todo
        </span>
        <p style="font-size: 2rem;">|</p>
        <!-- Cultura -->
        <label class="category-option">
            <input type="checkbox" name="categoria" value="cultura">
            <i class="bi bi-bank"></i>
            <span>Cultura</span>
        </label>
        <p style="font-size: 2rem;">|</p>
        <!-- Arte -->
        <label class="category-option">
            <input type="checkbox" name="categoria" value="arte">
            <i class="bi bi-palette"></i>
            <span>Arte</span>
        </label>
        <p style="font-size: 2rem;">|</p>
        <!-- Gastronomía -->
        <label class="category-option">
            <input type="checkbox" name="categoria" value="gastronomia">
            <i class="bi bi-egg-fried"></i>
            <span>Gastronomía</span>
        </label>
        <p style="font-size: 2rem;">|</p>
        <!-- Fiesta -->
        <label class="category-option">
            <input type="checkbox" name="categoria" value="fiesta">
            <i class="bi bi-music-note-beamed"></i>
            <span>Fiesta</span>
        </label>
    </div>
</section>

<!-- Nuestros tours -->

<section class="container my-5">
    <h3 class="text-center mb-4">Nuestros Tours</h3>
    <div id="tours-container" class="row g-4">
        <!-- Aquí se agregarán los tours con JS -->
    </div>
</section>


    <!-- Footer -->
    <div id="footer-container"></div>
    <script src="./JS/footer.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>

</html>
