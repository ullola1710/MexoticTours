<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuestros Tours</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet"> -->
    <link href="./CSS/costum.css" rel="stylesheet">
    <link href="./CSS/style.css" rel="stylesheet">
</head>

<body>

    <div id="navbar-container"></div>

    <main>
        <header class="masthead" style="background-image: url('./assets/bellas-artes.jpeg');">
            <div class="color-overlay d-flex flex-column justify-content-center align-items-center text-center">
                <h1>¿Listo para tu próxima aventura?</h1>
                <h2>¡Elige tu tour ahora!</h2>
            </div>
        </header>
        <!-- Sección de estados -->
        <section class="filtro-tours d-none d-lg-block">
            <div class="filtro-container">
                <button class="filtro-btn placeFilter" data-place="CDMX,Estado de México">EDOMEX/CDMX</button>
                <button class="filtro-btn placeFilter" data-place="Querétaro">Querétaro</button>
                <button class="filtro-btn placeFilter" data-place="Jalisco">Jalisco</button>
            </div>
        </section>

        <!--Estados mobile-->
        <br>
        <li class="nav-item d-lg-none" style="list-style: none;">
            <a class="nav-link text-dark text-center d-flex justify-content-center align-items-center"
                data-bs-toggle="collapse" href="#estadosMobile" role="button" aria-expanded="false"
                aria-controls="estadosMobile" id="toggleEstadosMobile">
                Región
                <i class="bi bi-chevron-right ms-2" id="arrowIcon"></i>
            </a>
            <div class="collapse w-90" id="estadosMobile">
                <ul class="navbar-nav w-90">
                    <li class="nav-item w-90">
                        <a class="nav-link text-dark text-center placeFilter" id="cdmx"
                            data-place="CDMX,Estado de México">CDMX/EDOMEX</a>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li class="nav-item w-90">
                        <a class="nav-link text-dark text-center placeFilter" id="queretaro"
                            data-place="Querétaro">Querétaro</a>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li class="nav-item w-90">
                        <a class="nav-link text-dark text-center placeFilter" id="jalisco"
                            data-place="Jalisco">Jalisco</a>
                    </li>
                </ul>
            </div>
        </li>


        <!-- Sección de categorías -->
        <section class="d-none d-lg-block">
            <div class="d-flex justify-content-center align-items-center gap-2 gap-md-4 flex-wrap">
                <span class="category-btn active categoryFilter" id="btnTodos" role="button" data-category="all">
                    <a href="./products.html" style="text-decoration: none; color: #0F0E0E;"><i
                            class="bi bi-list-ul"></i>Todo</a>
                </span>
                <p class="d-none d-md-block fs-2 m-0">|</p>

                <label class="category-option">
                    <input type="checkbox" name="categoria" value="cultura" class="categoryFilter"
                        data-category="Cultura">
                    <i class="bi bi-bank"></i>
                    <span>Cultura</span>
                </label>
                <p class="d-none d-md-block fs-2 m-0">|</p>

                <label class="category-option">
                    <input type="checkbox" name="categoria" value="arte" class="categoryFilter" data-category="Arte">
                    <i class="bi bi-palette"></i>
                    <span>Arte</span>
                </label>
                <p class="d-none d-md-block fs-2 m-0">|</p>

                <label class="category-option">
                    <input type="checkbox" name="categoria" value="gastronomia" class="categoryFilter"
                        data-category="Gastronomía">
                    <i class="bi bi-egg-fried"></i>
                    <span>Gastronomía</span>
                </label>
                <p class="d-none d-md-block fs-2 m-0">|</p>

                <label class="category-option">
                    <input type="checkbox" name="categoria" value="fiesta" class="categoryFilter"
                        data-category="Fiesta">
                    <i class="bi bi-music-note-beamed"></i>
                    <span>Fiesta</span>
                </label>
            </div>
        </section>
        <!--Categorías mobile-->
        <br>
        <li class="nav-item d-lg-none" style="list-style: none;">
            <a class="nav-link text-dark text-center d-flex justify-content-center align-items-center"
                data-bs-toggle="collapse" href="#categoriaMobile" role="button" aria-expanded="false"
                aria-controls="categoriaMobile" id="toggleCategoriasMobile category-option">
                Categoría
                <i class="bi bi-chevron-right ms-2" id="arrowIcon2"></i>
            </a>
            <div class="collapse w-90" id="categoriaMobile" style="align-items: center;">
                <ul class="navbar-nav w-90">
                    <li class="nav-item w-90">
                        <a href="./products.html" class="nav-link text-dark text-center categoryFilter active" id="todo"
                            data-category="all">Todo</a>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li class="nav-item w-90">
                        <a class="nav-link text-dark text-center category-option" style="font-size: 1rem;"><input
                                type="checkbox" name="categoria" value="arte" class="categoryFilter"
                                data-category="Cultura" style="margin-left: 8rem;">Cultura</a>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li class="nav-item w-90">
                        <a class="nav-link text-dark text-center category-option" style="font-size: 1rem;"><input
                                type="checkbox" name="categoria" value="arte" class="categoryFilter"
                                data-category="Arte" style="margin-left: 8rem;">Arte</a>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li class="nav-item w-90">
                        <a class="nav-link text-dark text-center category-option" style="font-size: 1rem;"><input
                                type="checkbox" name="categoria" value="arte" class="categoryFilter"
                                data-category="Gastronomía" style="margin-left: 8rem;">Gastronomía</a>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li class="nav-item w-90">
                        <a class="nav-link text-dark text-center category-option" style="font-size: 1rem;"><input
                                type="checkbox" name="categoria" value="arte" class="categoryFilter"
                                data-category="Fiesta" style="margin-left: 8rem;">Fiesta</a>
                    </li>
                </ul>
            </div>
        </li>
        <br>
        <!-- Cards de tours -->
        <section>
            <h3 class="text-center mb-4"></h3>
            <div class="cards-wrapper mx-auto">
                <div id="tours-container" class="row g-4">

                </div>
            </div>
        </section>
    </main>
    <br>
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script type="module" src="./JS/cart.js"></script>
    <script src="./JS/navbar.js"></script>
    <script type="module" src="./JS/cards_products.js"></script>
    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function () {
            emailjs.init("GNnB5jB5JcNSpPcEb"); // Tu User ID público
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <script src="./JS/footer.js"></script>


    <!-- Script para el icono de región -->
    <script>
        const collapseElement = document.getElementById('estadosMobile');
        const arrowIcon = document.getElementById('arrowIcon');

        collapseElement.addEventListener('show.bs.collapse', () => {
            arrowIcon.classList.remove('bi-chevron-right');
            arrowIcon.classList.add('bi-chevron-down');
        });

        collapseElement.addEventListener('hide.bs.collapse', () => {
            arrowIcon.classList.remove('bi-chevron-down');
            arrowIcon.classList.add('bi-chevron-right');
        });
    </script>

    <!-- Script para el icono de categorías -->
    <script>
        const collapseElement2 = document.getElementById('categoriaMobile');
        const arrowIcon2 = document.getElementById('arrowIcon2');

        collapseElement2.addEventListener('show.bs.collapse', () => {
            arrowIcon2.classList.remove('bi-chevron-right');
            arrowIcon2.classList.add('bi-chevron-down');
        });

        collapseElement2.addEventListener('hide.bs.collapse', () => {
            arrowIcon2.classList.remove('bi-chevron-down');
            arrowIcon2.classList.add('bi-chevron-right');
        });
    </script>

</body>

</html>
