<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Listo para tu próxima aventura?</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="./fonts/fonts.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

</head>

<body>
    <main class="main container col-12">

        <div class="container text-center">
            <span>
                <h1 class=""> ¿LISTO PARA TU PRÓXIMA AVENTURA?</h1>
            </span>
            <span>
                <h2>¡ELIGE TU TOUR AHORA!</h2>
            </span>
        </div>
        <br>
        <!-- filtro por estado  -->
        <div class="container text-center col-md-4 mb-3">
            <div class="row align-items-center">
                <div class="col-md-4 mb-3">
                    <button type="button" class="btn btn-dark"><select class="form-select"
                            aria-label="Default select example">
                            <option selected>CDMX</option>
                            <option value="1">One</option>
                            <option value="2">Two</option>
                            <option value="3">Three</option>
                        </select></button>
                </div>
                <div class="col-md-4 mb-3">
                    <button type="button" class="btn btn-dark"><select class="form-select"
                            aria-label="Default select example">
                            <option selected>Queretaro</option>
                            <option value="1">One</option>
                            <option value="2">Two</option>
                            <option value="3">Three</option>
                        </select></button>
                </div>
                <div class="col-md-4 mb-3">
                    <button type="button" class="btn btn-dark"><select class="form-select"
                            aria-label="Default select example">
                            <option selected>Jalisco</option>
                            <option value="1">One</option>
                            <option value="2">Two</option>
                            <option value="3">Three</option>
                        </select></button>
                </div>
            </div>
        </div>
        <br>
        <!-- filtro por categoria -->
        <div class="container text-center" style="border: solid salmon;">
            <div class="row align-items-center">
                <div class="col-md-3 mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="checkIndeterminate">
                        <label class="form-check-label" for="checkIndeterminate">Todo</label>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="checkIndeterminate">
                        <label class="form-check-label" for="checkIndeterminate">Cultura</label>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="checkIndeterminate">
                        <label class="form-check-label" for="checkIndeterminate">Arte</label>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="checkIndeterminate">
                        <label class="form-check-label" for="checkIndeterminate">Gastronomía</label>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="checkIndeterminate">
                            <label class="form-check-label" for="checkIndeterminate">Fiesta</label>
                        </div>
                    </div>
                </div>
            </div>

            <br>
            <div class="container text-center">
                <div id="contenedor-productos" class="row">

                </div>
            </div>
            <!-- <iframe width="650" height="350" src="https://www.youtube.com/embed/xoKugH6mOo8?autoplay=1&mute=1" frameborder="0"
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe> -->


    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./JS/main.js"></script>
</body>

</html>
