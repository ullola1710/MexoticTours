        <!--Estados mobile-->

 <li class="nav-item d-lg-none" style="list-style: none;">

        <!-- Sección de categorías -->
        <br>

                        <label class="category-option">
                            <input type="checkbox" name="categoria" value="arte" class="categoryFilter" data-category="Arte">

                <br>
 <li class="nav-item d-lg-none" style="list-style: none;">
                       <a class="nav-link text-dark text-center d-flex justify-content-center align-items-center" data-bs-toggle="collapse" href="#categoriaMobile" role="button"
                            aria-expanded="false" aria-controls="categoriaMobile" id="toggleCategoriasMobile category-option">
                            Categoría
                             <i class="bi bi-chevron-right ms-2" id="arrowIcon2"></i>
                        </a>
                        <div class="collapse w-90" id="categoriaMobile" style="align-items: center;">
                            <ul class="navbar-nav w-90">
                                <li class="nav-item w-90">
                                    <a  href="./products.html" class="nav-link text-dark text-center categoryFilter active" id="todo" data-category="all">Todo</a>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li class="nav-item w-90">

                                </li>

                                <li class="nav-item w-90">
                                  <a class="nav-link text-dark text-center category-option" style="font-size: 1rem;"><input type="checkbox" name="categoria" value="arte" class="categoryFilter" data-category="Arte" style="margin-left: 8rem;">Arte</a>
                                 </li>
                                <li><hr class="dropdown-divider"></li>
                                <li class="nav-item w-90">
                                    <a class="nav-link text-dark text-center category-option" style="font-size: 1rem;"><input type="checkbox" name="categoria" value="arte" class="categoryFilter" data-category="Gastronomía" style="margin-left: 8rem;">Gastronomía</a>

                                <li><hr class="dropdown-divider"></li>
                                <li class="nav-item w-90">

<br>

                <section>

                        </div>
                        </div>

        </main>
    <br>
        <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="./JS/navbar.js" defer></script>
    <script src="./JS/footer.js"></script>
    <script src="./JS/filtro.js"></script>

    <!-- Script para el icono de región -->
        <script>
        const collapseElement = document.getElementById('estadosMobile');
        const arrowIcon = document.getElementById('arrowIcon');

        collapseElement.addEventListener('show.bs.collapse', () => {
            arrowIcon.classList.remove('bi-chevron-right');
            arrowIcon.classList.add('bi-chevron-down');
        });

        collapseElement.addEventListener('hide.bs.collapse', () => {
            arrowIcon.classList.remove('bi-chevron-down');
            arrowIcon.classList.add('bi-chevron-right');
        });
    </script>

<!-- Script para el icono de categorías -->
        <script>
        const collapseElement2 = document.getElementById('categoriaMobile');
        const arrowIcon2 = document.getElementById('arrowIcon2');

        collapseElement2.addEventListener('show.bs.collapse', () => {
            arrowIcon2.classList.remove('bi-chevron-right');
            arrowIcon2.classList.add('bi-chevron-down');
        });

        collapseElement2.addEventListener('hide.bs.collapse', () => {
            arrowIcon2.classList.remove('bi-chevron-down');
            arrowIcon2.classList.add('bi-chevron-right');
        });
    </script>
