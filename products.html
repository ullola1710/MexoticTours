<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuestros Tours</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">

    <link href="./CSS/costum.css" rel="stylesheet">
    <link href="./CSS/style.css" rel="stylesheet">
</head>
<body>

    <div id="navbar-container"></div>
    
    <main>
        <header class="masthead" style="background-image: url('./assets/bellasartes.png');">
            <div class="color-overlay d-flex flex-column justify-content-center align-items-center text-center">
                <h1>¿Listo para tu próxima aventura?</h1>
                <h2>¡Elige tu tour ahora!</h2>
            </div>
        </header>
        <!-- Sección de estados -->
        <section class="filtro-tours mb-5">
        <div class="filtro-container">
            <button class="filtro-btn">Estado de México/CDMX</button>
            <button class="filtro-btn">Querétaro</button>
            <button class="filtro-btn">Jalisco</button>
        </div>
        </section>

        <!-- Sección de categorías -->
        <br>
                <section class="mb-5">
                    <div class="d-flex justify-content-center align-items-center gap-2 gap-md-4 flex-wrap">
                        <span class="category-btn active" role="button">
                            <i class="bi bi-list-ul"></i> Todo
                        </span>
                        <p class="d-none d-md-block fs-2 m-0">|</p>

                        <label class="category-option">
                            <input type="checkbox" name="categoria" value="cultura">
                            <i class="bi bi-bank"></i>
                            <span>Cultura</span>
                        </label>
                        <p class="d-none d-md-block fs-2 m-0">|</p>

                        <label class="category-option">
                            <input type="checkbox" name="categoria" value="arte">
                            <i class="bi bi-palette"></i>
                            <span>Arte</span>
                        </label>
                        <p class="d-none d-md-block fs-2 m-0">|</p>

                        <label class="category-option">
                            <input type="checkbox" name="categoria" value="gastronomia">
                            <i class="bi bi-egg-fried"></i>
                            <span>Gastronomía</span>
                        </label>
                        <p class="d-none d-md-block fs-2 m-0">|</p>

                        <label class="category-option">
                            <input type="checkbox" name="categoria" value="fiesta">
                            <i class="bi bi-music-note-beamed"></i>
                            <span>Fiesta</span>
                        </label>
                    </div>
                </section>
        <!-- Cards de tours -->
                <section>
                    <h3 class="text-center mb-4"></h3>
                    <div class="cards-wrapper mx-auto">
                    <div id="tours-container" class="row g-4">

                        </div>
                        </div>
                </section>
        </main>
    <br>
        <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="./JS/navbar.js" defer></script>
    <script src="./JS/footer.js"></script>
    <script src="./JS/cards_products.js"></script>

</body>
</html>
